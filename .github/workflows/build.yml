name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build SessionSync.exe
        shell: cmd
        run: build.cmd

      - name: Data-layer tests
        shell: cmd
        run: build.cmd test

      - name: UI test on demo data
        shell: cmd
        run: build.cmd uitest-ci

      - uses: actions/upload-artifact@v4
        with:
          name: SessionSync
          path: SessionSync.exe
